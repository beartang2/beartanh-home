<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지를 찾을 수 없어요 | BeartanH</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a1a2f">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { --bg:#0a1a2f; --line:#1f3a5c; --chalk:#e4ecf7; --steel:#8ba3c1; --amber:#f2b33d; --grid:rgba(127,178,255,.05); color-scheme: dark; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; box-sizing:border-box;
      background:var(--bg); background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:24px 24px;
      color:var(--chalk); font-family:-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo",sans-serif; word-break:keep-all; }
    main { max-width:420px; border:1px dashed var(--line); padding:28px; }
    .code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--steel); font-size:13px; margin:0 0 12px; }
    h1 { margin:0 0 8px; font-size:22px; letter-spacing:-.02em; }
    p { margin:0 0 24px; color:var(--steel); line-height:1.7; }
    a { color:var(--amber); font-weight:600; text-underline-offset:3px; }
    a:focus-visible { outline:2px solid var(--amber); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404 / record not found</p>
    <h1>찾는 페이지가 없어요</h1>
    <p>주소가 바뀌었거나 아직 기록되지 않은 페이지예요.</p>
    <a href="/">아카이브로 돌아가기</a>
  </main>
</body>
</html>
